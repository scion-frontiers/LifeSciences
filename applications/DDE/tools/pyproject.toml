# DDE CLI packaging — PEP 621.
#
# The entry point is `dde = "dde.cli:main"`, which replaces the
# hand-rolled dde-cli shim that install.sh used to symlink into the
# venv.  `pip install -e .` produces a proper console_scripts wrapper
# that works in subshells and loops without PYTHONPATH gymnastics.
#
# Dependencies are declared here for metadata completeness, but
# install.sh still installs them explicitly from requirements.txt and
# requirements-science.txt (separate transactions, core-fatal /
# science-survivable).  install.sh uses `--no-deps` when running the
# editable install so these declarations do not override that flow.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dde"
version = "0.3.0"  # Keep in sync with CLI_VERSION in dde/core/env.py
description = "Execution surface for dde agent tooling"
requires-python = ">=3.11"

# Core CLI dependencies — mirrors tools/requirements.txt.
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "mistune>=3.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "numpy>=1.26",
    "zstandard>=0.22",
    "google-cloud-aiplatform>=1.60",
]

[project.optional-dependencies]
# Science stack — mirrors tools/requirements-science.txt.
# `pip install -e ".[science]"` is equivalent to install.sh's full
# (non --core-only) install.
science = [
    "rdkit>=2024.3.1",
    "meeko>=0.5",
    "gemmi>=0.7",
    "pubchempy>=1.0.4",
    "biopython>=1.84",
    "prody>=2.4",
    "chembl-webresource-client>=0.10.9",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.scripts]
dde = "dde.cli:main"

[tool.setuptools.packages.find]
include = ["dde*"]

[tool.setuptools.package-data]
dde = ["site_templates/**/*.html"]
